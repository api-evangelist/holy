aid: holy
name: HOLY
description: 'HOLY is a German direct-to-consumer beverage brand offering sugar-free, powdered
  and syrup-based drink mixes that customers prepare with water or milk. Its product families
  span HOLY Energy (caffeine and vitamins), HOLY Iced Tea, HOLY Hydration (isotonic
  electrolytes), HOLY Milkshake (low-calorie), and HOLY Syrup. Founded by three friends
  (Matze, Fred, and Phil), the company grew from a shared apartment to 50+ employees, 2
  million customers, and 500,000+ social followers, positioned on "great taste with a good
  conscience." HOLY sells online via a Shopify storefront and exposes a modern agentic-commerce
  surface: a hosted Storefront MCP server, a Universal Commerce Protocol (UCP) endpoint,
  llms.txt / agents.md agent instructions, and Shopify Customer Account OAuth/OIDC.'
