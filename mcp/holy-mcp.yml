source: https://de.holy.com/llms.txt
server:
  name: holy-storefront
  description: >-
    HOLY's hosted Shopify Storefront MCP server for agentic commerce. Exposes catalog
    search, cart management, product detail lookup, and store-policy/FAQ retrieval over the
    Model Context Protocol. A second Universal Commerce Protocol (UCP) MCP endpoint at
    /api/ucp/mcp handles agentic checkout (requires an agent profile URI). A Shopify
    Customer Account MCP API (customer-account-mcp-api:full scope) is also advertised in the
    /.well-known/customer-account-api document for authenticated customer operations.
  transport: http
  protocol: model-context-protocol
  url: https://de.holy.com/api/mcp
  ucp_url: https://de.holy.com/api/ucp/mcp
  customer_account_mcp_url: https://shopify.com/47328854173/account/customer/api/mcp
  content_type: application/json
tools:
- name: search_catalog
  description: Search for products from the online store, hosted on Shopify (natural language and/or filters, paginated).
- name: get_cart
  description: Get the cart including items, shipping options, discount info, and checkout URL.
- name: update_cart
  description: Perform updates to a cart, including adding/removing/updating line items and buyer details.
- name: search_shop_policies_and_faqs
  description: Get facts about the store's policies, products, or services.
- name: get_product_details
  description: Look up a product by ID; pass the options parameter to select a specific variant.
